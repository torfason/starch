<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Activity Index</title>
<style>
:root {
  --bg: #ffffff; --sidebar-bg: #f4f6f8; --border: #e1e4e8;
  --text: #2c3e50; --text-muted: #6b7280;
  --selected-bg: #2980b9; --selected-text: #ffffff;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  color: var(--text); background: var(--bg);
}
.layout { display: flex; height: 100vh; overflow: hidden; }
.sidebar {
  width: 320px; flex-shrink: 0; background: var(--sidebar-bg);
  border-right: 1px solid var(--border); display: flex; flex-direction: column;
}
.sidebar-header {
  padding: 0.9rem 1.25rem; border-bottom: 1px solid var(--border); background: var(--bg);
}
.sidebar-header h1 { font-size: 1rem; margin: 0; font-weight: 600; }
.sidebar-header .count { font-size: 0.78rem; color: var(--text-muted); margin-top: 0.15rem; }
.cards { overflow-y: auto; flex: 1; outline: none; }
.card {
  padding: 0.7rem 1.25rem; border-bottom: 1px solid var(--border);
  cursor: pointer; transition: background 0.08s;
}
.card:hover { background: #eaedf0; }
.card.nopage { opacity: 0.5; cursor: default; }
.card.nopage:hover { background: transparent; }
.card.selected { background: var(--selected-bg); color: var(--selected-text); }
.card.selected .card-meta, .card.selected .card-stats { color: rgba(255,255,255,0.85); }
.card-meta {
  display: flex; justify-content: space-between; font-size: 0.74rem;
  color: var(--text-muted); margin-bottom: 0.2rem;
}
.card-name {
  font-weight: 500; font-size: 0.92rem; line-height: 1.3; margin-bottom: 0.2rem;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card-stats { font-size: 0.8rem; color: var(--text-muted); }
.main { flex: 1; position: relative; }
.main iframe { width: 100%; height: 100%; border: none; display: block; }
.placeholder {
  position: absolute; inset: 0; display: flex; align-items: center;
  justify-content: center; color: var(--text-muted); font-size: 0.9rem;
  text-align: center; padding: 2rem;
}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <header class="sidebar-header">
      <h1>Activities</h1>
      <div class="count">{{n_pages}} of {{count}} rendered &nbsp;·&nbsp; ↑ ↓ to navigate</div>
    </header>
    <nav class="cards" id="cards" tabindex="0" role="listbox" aria-label="Activities">
      {{cards_html}}
    </nav>
  </aside>
  <main class="main">
    <iframe id="viewer" src="" title="Selected activity"></iframe>
    <div class="placeholder" id="placeholder">No activity pages have been rendered yet.</div>
  </main>
</div>
<script>
(function() {
  const cardsEl = document.getElementById('cards');
  const viewer  = document.getElementById('viewer');
  const holder  = document.getElementById('placeholder');
  const cards   = Array.from(cardsEl.querySelectorAll('.card'));
  // Only cards with a rendered page participate in selection and keyboard nav.
  const live    = cards.filter(c => c.dataset.src);
  let selected  = -1;

  function show(el) {
    viewer.style.display = el ? 'block' : 'none';
    holder.style.display = el ? 'none' : 'flex';
  }

  function selectIndex(i) {
    if (i < 0 || i >= live.length) return;
    if (selected >= 0) {
      live[selected].classList.remove('selected');
      live[selected].setAttribute('aria-selected', 'false');
    }
    selected = i;
    const card = live[i];
    card.classList.add('selected');
    card.setAttribute('aria-selected', 'true');
    const src = card.dataset.src;
    if (src && viewer.getAttribute('src') !== src) viewer.setAttribute('src', src);
    show(true);
    if (card.dataset.id) history.replaceState(null, '', '#' + card.dataset.id);
    card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  live.forEach((card, i) => card.addEventListener('click', () => selectIndex(i)));

  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'ArrowDown' || e.key === 'j') {
      e.preventDefault(); selectIndex(Math.min(selected + 1, live.length - 1));
    } else if (e.key === 'ArrowUp' || e.key === 'k') {
      e.preventDefault(); selectIndex(Math.max(selected - 1, 0));
    } else if (e.key === 'Home') {
      e.preventDefault(); selectIndex(0);
    } else if (e.key === 'End') {
      e.preventDefault(); selectIndex(live.length - 1);
    }
  });

  window.addEventListener('hashchange', () => {
    const idx = live.findIndex(c => c.dataset.id === window.location.hash.slice(1));
    if (idx >= 0 && idx !== selected) selectIndex(idx);
  });

  if (live.length > 0) {
    const hash = window.location.hash.slice(1);
    let idx = hash ? live.findIndex(c => c.dataset.id === hash) : -1;
    selectIndex(idx < 0 ? 0 : idx);
  } else {
    show(false);
  }
  cardsEl.focus();
})();
</script>
</body>
</html>
