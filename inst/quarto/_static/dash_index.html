<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Activity Index</title>
<style>
:root {
  --bg: #ffffff; --sidebar-bg: #f4f6f8; --border: #e1e4e8;
  --text: #2c3e50; --text-muted: #6b7280;
  --selected-bg: #2980b9; --selected-text: #ffffff;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  color: var(--text); background: var(--bg);
}
.layout { display: flex; height: 100vh; overflow: hidden; }
.sidebar {
  width: 320px; flex-shrink: 0; background: var(--sidebar-bg);
  border-right: 1px solid var(--border); display: flex; flex-direction: column;
}
.sidebar-header {
  padding: 0.9rem 1.25rem; border-bottom: 1px solid var(--border); background: var(--bg);
}
.sidebar-header h1 { font-size: 1rem; margin: 0; font-weight: 600; }
.sidebar-header .count { font-size: 0.78rem; color: var(--text-muted); margin-top: 0.15rem; }
.cards { overflow-y: auto; flex: 1; outline: none; }
.card {
  padding: 0.7rem 1.25rem; border-bottom: 1px solid var(--border);
  cursor: pointer; transition: background 0.08s;
}
.card:hover { background: #eaedf0; }
.card.page { background: #eaeff4; border-left: 3px solid var(--selected-bg); }
.card.page:hover { background: #dfe6ed; }
.card.page.selected { background: var(--selected-bg); border-left-color: var(--selected-bg); }
.pages { border-bottom: 2px solid #cfd6dd; }
.pages:empty { border-bottom: none; }
.card.nopage { opacity: 0.5; cursor: default; }
.card.nopage:hover { background: transparent; }
.card.selected { background: var(--selected-bg); color: var(--selected-text); }
.card.selected .card-meta, .card.selected .card-stats { color: rgba(255,255,255,0.85); }
.card-meta {
  display: flex; justify-content: space-between; font-size: 0.74rem;
  color: var(--text-muted); margin-bottom: 0.2rem;
}
.card-name {
  font-weight: 500; font-size: 0.92rem; line-height: 1.3; margin-bottom: 0.2rem;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card-stats { font-size: 0.8rem; color: var(--text-muted); }
.main { flex: 1; position: relative; }
.main iframe { width: 100%; height: 100%; border: none; display: block; }
.placeholder {
  position: absolute; inset: 0; display: flex; align-items: center;
  justify-content: center; color: var(--text-muted); font-size: 0.9rem;
  text-align: center; padding: 2rem;
}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <header class="sidebar-header">
      <h1>Activities</h1>
      <div class="count" id="count">Loading&hellip;</div>
    </header>
    <nav class="cards" id="cards" tabindex="0" role="listbox" aria-label="Activities">
      <div class="pages" id="pages"></div>
      <div id="activity-cards"></div>
    </nav>
  </aside>
  <main class="main">
    <iframe id="viewer" src="" title="Selected activity"></iframe>
    <div class="placeholder" id="placeholder">No activities loaded.</div>
  </main>
</div>

<!-- Data and helpers arrive as classic scripts so that this page works when
     opened directly from disk. See starch-dash.js for why that matters. -->
<script src="lib/starch-dash.js"></script>
<script src="data/activities.js"></script>
<script>
(function () {
  var S = window.STARCH;
  var acts = S.activities();

  // Standalone pages, listed above the activity cards. Adding one is a single
  // entry here plus its template on the R side.
  var PAGES = [
    { file: "dash_overview.html", title: "All activities", subtitle: "Table and trends" }
  ];

  function esc(s) {
    return String(s === null || s === undefined ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  document.getElementById("pages").innerHTML = PAGES.map(function (p) {
    return '<article class="card page" data-id="' + esc(p.file.replace(/\.html$/, "")) +
      '" data-src="' + esc(p.file) + '" role="option" aria-selected="false">' +
      '<div class="card-name">' + esc(p.title) + "</div>" +
      '<div class="card-stats">' + esc(p.subtitle) + "</div></article>";
  }).join("\n");

  document.getElementById("activity-cards").innerHTML = acts.map(function (a) {
    var live = a.has_stream === true;
    var src = live ? "detail_a.html?id=" + encodeURIComponent(a.activity_id) : "";
    var d = a.date;
    var dstr = d && !isNaN(d) ? d.toISOString().slice(0, 10) : "";
    var tstr = d && !isNaN(d) ? d.toISOString().slice(11, 16) : "";
    return '<article class="' + (live ? "card" : "card nopage") + '" data-id="' +
      esc(a.activity_id) + '" data-src="' + esc(src) +
      '" role="option" aria-selected="false">' +
      '<div class="card-meta"><span>' + esc(dstr + " " + tstr) + "</span><span>" +
      esc(a.activity_type) + "</span></div>" +
      '<div class="card-name">' + esc(a.activity_name || "(unnamed)") + "</div>" +
      '<div class="card-stats">' + esc(S.cardStats(a)) + "</div></article>";
  }).join("\n");

  var nStream = acts.filter(function (a) { return a.has_stream === true; }).length;
  document.getElementById("count").innerHTML =
    nStream + " of " + acts.length + " with streams &nbsp;\u00b7&nbsp; \u2191 \u2193 to navigate";

  var cardsEl = document.getElementById("cards");
  var viewer = document.getElementById("viewer");
  var holder = document.getElementById("placeholder");
  var live = Array.prototype.slice.call(cardsEl.querySelectorAll(".card"))
    .filter(function (c) { return c.dataset.src; });
  var selected = -1;

  function show(on) {
    viewer.style.display = on ? "block" : "none";
    holder.style.display = on ? "none" : "flex";
  }

  function selectIndex(i) {
    if (i < 0 || i >= live.length) return;
    if (selected >= 0) {
      live[selected].classList.remove("selected");
      live[selected].setAttribute("aria-selected", "false");
    }
    selected = i;
    var card = live[i];
    card.classList.add("selected");
    card.setAttribute("aria-selected", "true");
    var src = card.dataset.src;
    if (src && viewer.getAttribute("src") !== src) viewer.setAttribute("src", src);
    show(true);
    // A file:// document has an opaque origin, and Chrome throws a
    // SecurityError from replaceState() there. Deep links into the index still
    // work -- the hash is read on load and on hashchange -- but the address bar
    // stops tracking the selection when the page is opened from disk rather
    // than served. Left in a try/catch rather than dropped so that the served
    // case keeps its shareable URLs.
    if (card.dataset.id) {
      try {
        history.replaceState(null, "", "#" + card.dataset.id);
      } catch (e) { /* file:// -- see above */ }
    }
    card.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }

  live.forEach(function (card, i) {
    card.addEventListener("click", function () { selectIndex(i); });
  });

  document.addEventListener("keydown", function (e) {
    if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
    if (e.key === "ArrowDown" || e.key === "j") {
      e.preventDefault(); selectIndex(Math.min(selected + 1, live.length - 1));
    } else if (e.key === "ArrowUp" || e.key === "k") {
      e.preventDefault(); selectIndex(Math.max(selected - 1, 0));
    } else if (e.key === "Home") {
      e.preventDefault(); selectIndex(0);
    } else if (e.key === "End") {
      e.preventDefault(); selectIndex(live.length - 1);
    }
  });

  window.addEventListener("hashchange", function () {
    var want = window.location.hash.slice(1);
    for (var i = 0; i < live.length; i++) {
      if (live[i].dataset.id === want && i !== selected) { selectIndex(i); return; }
    }
  });

  if (live.length > 0) {
    var hash = window.location.hash.slice(1);
    var idx = -1;
    if (hash) {
      for (var i = 0; i < live.length; i++) {
        if (live[i].dataset.id === hash) { idx = i; break; }
      }
    }
    selectIndex(idx < 0 ? 0 : idx);
  } else {
    show(false);
  }
  cardsEl.focus();
})();
</script>
</body>
</html>
